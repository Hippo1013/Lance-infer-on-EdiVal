<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MICE · 人工评分</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#203047;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#172b46;color:white;padding:20px 28px}h1{font-size:23px;margin:0 0 8px}header p{margin:0;color:#c5d2e3;font-size:14px}.layout{display:grid;grid-template-columns:250px 1fr;gap:20px;max-width:1700px;margin:auto;padding:20px}aside{position:sticky;top:15px;height:calc(100vh - 35px);overflow:auto;background:white;border-radius:12px;padding:16px}main{min-width:0}button,select,textarea{font:inherit}button,select{padding:9px 12px;border:1px solid #cbd5e1;border-radius:7px;background:white;cursor:pointer}button:hover{background:#eaf1fa}button:disabled{opacity:.4;cursor:default}a{color:#215faa}.progress{font-weight:700;margin-bottom:12px}progress{width:100%;accent-color:#2878c7}.navitem{display:block;width:100%;text-align:left;margin:6px 0;font-size:13px}.navitem.active{border-color:#3279c4;background:#eaf2fc}.navitem small{display:block;color:#65758b;margin-top:5px}.panel{background:white;padding:20px;border:1px solid #e0e6ee;border-radius:12px;margin-bottom:16px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:12px 0 6px}.rules{border-left:4px solid #3682cc;background:#f8fbff}.rules p{line-height:1.65;margin:8px 0}.muted{font-size:13px;color:#65758b}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.badge{background:#e9edf5;padding:4px 9px;border-radius:20px;font-size:12px}.history{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.history article{background:#f8fafc;border-radius:8px;overflow:hidden;border:1px solid #e1e7ef}.history img{width:100%;height:260px;object-fit:contain;cursor:zoom-in;background:#e7ebf0;display:block}.history .text{padding:10px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}.current{border:2px solid #337cc5!important}.current .text{background:#eaf4ff}details{margin:12px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;line-height:1.6;font-size:13px;background:#f4f6fa;padding:14px;border-radius:8px;max-height:480px;overflow:auto}.decisions{display:flex;gap:10px;flex-wrap:wrap}.decisions button.selected{outline:3px solid #377ac0;outline-offset:1px}.pass{background:#e7f6ee;color:#216640}.fail{background:#fceced;color:#94313a}textarea{width:100%;min-height:90px;margin-top:12px;padding:12px;border:1px solid #cbd5e1;border-radius:8px}.save{color:#246649;font-size:14px}.error{color:#ad2537}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}dialog{width:95vw;max-width:1600px;border:0;border-radius:12px;background:#f7f9fc;padding:18px}dialog::backdrop{background:#0c172dcc}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.compare img{width:100%;height:70vh;object-fit:contain;cursor:zoom-in}.zoom{max-width:none;width:auto;height:auto!important}#compareTitle{margin:0 0 10px}.tip{padding:8px;background:#fff6df;color:#7e6122;border-radius:6px}#filter{width:100%;margin:10px 0}@media(max-width:1100px){.history{grid-template-columns:repeat(2,minmax(0,1fr))}.history img{height:300px}}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:10px}aside{position:static;height:auto}#list{max-height:180px;overflow:auto}.panel{padding:14px}.compare{grid-template-columns:1fr}.compare img{height:45vh}.history img{height:210px}}
</style>
<header><h1>MICE · 人工待定项评分</h1><p>Qwen 单次全量 · 31 项人工判断 · 原图与真实历史 · 独立保存人工结果</p></header>
<div class="layout"><aside><div id="progress" class="progress">正在加载…</div><progress id="bar" max="31" value="0"></progress><div id="counts" class="muted"></div><select id="filter"><option value="all">全部项目</option><option value="open">未评 / 仍待定</option><option value="IF">仅 IF</option><option value="GA_prefix">仅 GA</option><option value="response_incomplete">回答不完整</option></select><button id="nextOpen">下一待处理项</button><div id="list"></div><p><a id="export" href="/api/export.json">导出人工评分 JSON</a></p><p class="muted">无需额外评37轮累计GA。人工确认前缀后再重算累计结果。</p></aside>
<main><div class="panel rules"><h2>评分规则</h2><p id="rule"></p><p id="splitRule"></p><p class="muted">1分＝满足本项要求；0分＝明确不满足；仍待定＝证据不足，保持空分数。请按图像独立判断，Qwen原回答仅作参考。</p><p class="muted">选择后点「保存评分」。页面显示「已保存」才代表写入服务器；可随时修改。原自动评分证据保留。</p></div>
<div id="content"></div></main></div>
<dialog id="viewer"><div class="toolbar"><h2 id="compareTitle">图像对比</h2><button id="close">关闭</button></div><div class="toolbar"><label>左侧 <select id="left"></select></label><label>右侧 <select id="right"></select></label><span class="muted">点图片切换原始像素 / 适应窗口</span></div><div class="compare"><div style="overflow:auto"><img id="leftImg"></div><div style="overflow:auto"><img id="rightImg"></div></div></dialog>
<script>
let data,items,ratings={},index=0,dirty=false,busy=false,draft={};const $=x=>document.getElementById(x);const name={pass:'1分 · 满足',fail:'0分 · 不满足',uncertain:'仍待定',unrated:'未评'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function rating(i){return ratings[i.id]||{decision:'unrated',note:'',version:0}}
function visible(i){const f=$('filter').value;return f==='all'||(f==='open'&&!['pass','fail'].includes(rating(i).decision))||i.metric===f||i.status===f}
function nav(){const resolved=items.filter(i=>['pass','fail'].includes(rating(i).decision)).length;$('progress').textContent=`已明确评分 ${resolved} / ${items.length}`;$('bar').value=resolved;const n=items.filter(i=>rating(i).decision==='uncertain').length;$('counts').textContent=`仍待定 ${n} · 未评 ${items.length-resolved-n}`;$('list').replaceChildren();for(const [k,i] of items.entries()){if(!visible(i))continue;const b=el('button',`${k+1}. ${i.metric==='IF'?'IF':'GA'} · 第${i.turn}轮`, 'navitem'+(k===index?' active':''));b.append(el('small',`${i.split.toUpperCase()} ${i.session_id.split('/')[1].slice(0,8)} · ${name[rating(i).decision]}`));b.onclick=()=>go(k);$('list').append(b)}}
function go(k){if(busy)return;if(dirty){alert('请先保存当前评分，或点击「撤销未保存修改」。');return}index=k;render();nav()}
function render(){const i=items[index],r=rating(i);draft={decision:r.decision,note:r.note};$('rule').textContent=data.manifest.rules[i.metric];$('splitRule').textContent=i.metric==='GA_prefix'?data.manifest.rules[i.split.toUpperCase()]:`当前任务类型：${i.task_type}。显式目标：${i.formatted[i.turn-1]}`;const root=$('content');root.replaceChildren();const panel=el('section',undefined,'panel');const top=el('div',undefined,'toolbar');top.append(el('h2',`项目 ${index+1} / ${items.length} · ${i.metric==='IF'?'IF 指令遵循':'GA 完整前缀'} · 第${i.turn}轮`),el('span',i.status==='pending_review'?'标签待定':'回答不完整','badge'));panel.append(top,el('p',i.session_id,'muted'));const h=el('div',undefined,'history');for(const img of i.images){const card=el('article',undefined,img.turn===i.turn?'current':'');const im=el('img');im.src=img.url;im.alt=img.turn?`第${img.turn}轮结果`:'原图';im.onclick=()=>compare(img.turn);card.append(im);const tx=el('div',undefined,'text');tx.append(el('h3',img.turn?`第${img.turn}轮结果${img.turn===i.turn?' · 当前':''}`:'原始图像'));if(img.turn){tx.append(el('div',i.instructions[img.turn-1]));const d=el('details');d.append(el('summary','显式目标指令'),el('p',i.formatted[img.turn-1]));tx.append(d)}card.append(tx);h.append(card)}panel.append(h,el('p','点击任意图片打开并排放大对比；只展示截至本项当前轮的历史。','muted'));const ev=el('details');ev.append(el('summary','待定原因与 Qwen 原回答'));ev.append(el('p',i.reason||i.cause,'tip'));for(const [k,t] of i.traces.entries()){ev.append(el('h3',`回答 ${k+1} · ${t.kind} · ${t.finish_reason||'正常完成'}`),el('pre',t.raw||'（空回答）'));const d=el('details');d.append(el('summary','本次裁判完整评分提示（原文）'),el('pre',t.prompt));ev.append(d)}panel.append(ev);root.append(panel);const rate=el('section',undefined,'panel');rate.append(el('h2','人工评分'));const buttons=el('div',undefined,'decisions');for(const d of ['pass','fail','uncertain','unrated']){const b=el('button',name[d],d+(draft.decision===d?' selected':''));b.dataset.decision=d;b.onclick=()=>{draft.decision=d;dirty=true;for(const x of buttons.children)x.classList.toggle('selected',x.dataset.decision===d);status('尚未保存')};buttons.append(b)}rate.append(buttons);const note=el('textarea');note.placeholder='备注（选填）：失败轮次、未满足的要求或仍无法判断的原因';note.value=draft.note;note.oninput=()=>{draft.note=note.value;dirty=true;status('尚未保存')};rate.append(note);const ft=el('div',undefined,'footer');const st=el('span',r.version?'已保存':'尚未评分','save');st.id='saveState';const save=el('button','保存评分');save.id='save';save.onclick=()=>saveRating(false);const next=el('button','保存并下一项');next.id='saveNext';next.onclick=()=>saveRating(true);const undo=el('button','撤销未保存修改');undo.onclick=()=>{if(!busy){dirty=false;render()}};ft.append(st,save,next,undo);rate.append(ft);const pager=el('div',undefined,'footer');const prev=el('button','上一项');prev.disabled=index===0;prev.onclick=()=>go(index-1);const nx=el('button','下一项');nx.disabled=index===items.length-1;nx.onclick=()=>go(index+1);pager.append(prev,nx);rate.append(pager);root.append(rate)}
function status(text,error=false){$('saveState').textContent=text;$('saveState').className=error?'error':'save'}
async function saveRating(next){if(busy)return;busy=true;$('save').disabled=$('saveNext').disabled=true;status('保存中…');const i=items[index],r=rating(i);try{const resp=await fetch('/api/rating',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':data.token},body:JSON.stringify({id:i.id,fingerprint:data.fingerprint,version:r.version,...draft})});const out=await resp.json();if(!resp.ok)throw Error(out.error);ratings[i.id]=out.rating;dirty=false;status('已保存');nav();busy=false;if(next&&index<items.length-1)go(index+1)}catch(e){status(`未保存：${e.message}；可点击保存重试`,true);busy=false}finally{if($('save'))$('save').disabled=$('saveNext').disabled=false}}
function compare(turn){const i=items[index];for(const id of ['left','right']){$(id).replaceChildren();for(const img of i.images){const o=el('option',img.turn?`第${img.turn}轮结果`:'原图');o.value=img.turn;$(id).append(o)}}$('left').value=Math.max(0,turn-1);$('right').value=turn;$('compareTitle').textContent=`${i.session_id} · 第${i.turn}轮人工核对`;drawCompare();$('viewer').showModal()}
function drawCompare(){for(const id of ['left','right']){$(id+'Img').className='';$(id+'Img').src=items[index].images[Number($(id).value)].url}}
$('left').onchange=$('right').onchange=drawCompare;$('close').onclick=()=>$('viewer').close();for(const id of ['leftImg','rightImg'])$(id).onclick=()=>$(id).classList.toggle('zoom');$('filter').onchange=nav;$('nextOpen').onclick=()=>{const k=items.findIndex((i,k)=>k>index&&!['pass','fail'].includes(rating(i).decision));const first=items.findIndex(i=>!['pass','fail'].includes(rating(i).decision));if(k>=0||first>=0)go(k>=0?k:first)};$('export').onclick=e=>{if(dirty||busy){e.preventDefault();alert('请先保存当前修改再导出。')}};window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue=''}});
fetch('/api/init').then(r=>{if(!r.ok)throw Error('连接失败');return r.json()}).then(d=>{data=d;items=d.manifest.items;for(const r of d.ratings)ratings[r.id]=r;index=Math.max(0,items.findIndex(i=>!['pass','fail'].includes(rating(i).decision)));render();nav()}).catch(e=>{$('progress').textContent='加载失败：'+e.message});
</script></html>
