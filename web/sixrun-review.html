<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lance 六组推理结果对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#182330;font:15px/1.5 system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #dce1e6;padding:18px 28px}h1{font-size:23px;margin:0 0 6px}p{margin:6px 0}.muted{color:#647181}main{max-width:1800px;margin:auto;padding:20px 28px}button,select,input{font:inherit;padding:8px 12px;border:1px solid #bac5d0;border-radius:7px;background:#fff;color:inherit}button{cursor:pointer}button.active{background:#1a5868;color:white}button:disabled{opacity:.4;cursor:default}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}#search{width:300px}#session{max-width:480px;flex:1}#status{min-height:24px;color:#a13724}#content{background:#fff;border:1px solid #dce1e6;border-radius:12px;padding:18px}.grid{display:grid;gap:12px;margin:10px 0;align-items:start}.cell{min-width:0}img{width:100%;aspect-ratio:1;object-fit:contain;background:#eef1f4;cursor:zoom-in;border:1px solid #e0e5ea;border-radius:6px}.instruction{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.label{font-weight:700;margin:4px 0 8px}.variant{border-top:1px solid #dde5eb;padding-top:12px;margin-top:14px}.tag{font-size:13px;color:#596b7d}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f3f6;padding:12px;max-height:440px;overflow:auto;font-size:12px}details{margin-top:16px}dialog{border:0;border-radius:12px;width:min(1100px,96vw);max-height:96vh;padding:14px}dialog::backdrop{background:#101827cc}dialog img{aspect-ratio:auto;max-height:80vh;cursor:default}#zoomTitle{margin-bottom:10px}@media(max-width:800px){main,header{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}#session{max-width:100%;flex-basis:100%}}
</style>
<header><h1>Lance 六组推理结果对照</h1><p class="muted">2026-10-07 完成的实验 · bare-v2 / chat-v1 · 每一行都是该协议独立生成并连续反馈的真实会话</p><p class="muted">英文原指令为实验依据。点击图片放大；左右方向键切换会话。此页面只读，不写入人工评分。</p></header>
<main><nav class="bar" id="benches"></nav><div class="bar"><input id="search" placeholder="搜索会话 ID 或英文指令" aria-label="搜索"><select id="split" aria-label="类别"></select><span id="coverage"></span></div>
<div class="bar"><button id="prev">← 上一会话</button><select id="session" aria-label="会话"></select><button id="next">下一会话 →</button><button id="nextBench">下一 bench →</button></div><p id="status" role="status">正在连接服务器…</p><article id="content"></article></main>
<dialog id="zoom"><div class="bar"><strong id="zoomTitle"></strong><button id="closeZoom">关闭</button></div><img id="zoomImage" alt="放大结果"></dialog>
<script>
const $=id=>document.getElementById(id), order=['edival','mice','imgedit'], names={edival:'EdiVal',mice:'MICE',imgedit:'ImgEdit'};let catalog, bench='edival', filtered=[], current=0, ticket=0;
function el(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
async function get(url){let r=await fetch(url);if(!r.ok)throw Error(`请求失败 ${r.status}: ${url}`);return r.json()}
function setBench(b){bench=b;$('search').value='';$('split').replaceChildren(el('option','全部类别'));$('split').firstChild.value='';[...new Set(catalog[b].sessions.map(s=>s.split))].forEach(s=>{let o=el('option',s);o.value=s;$('split').append(o)});document.querySelectorAll('#benches button').forEach(e=>e.classList.toggle('active',e.dataset.bench===b));$('nextBench').disabled=b==='imgedit';filter() ;history.replaceState(null,'',`/?bench=${b}`)}
function filter(){let q=$('search').value.toLowerCase(),split=$('split').value;filtered=catalog[bench].sessions.filter(s=>(!split||s.split===split)&&(`${s.id} ${s.instructions_en.join(' ')}`).toLowerCase().includes(q));$('session').replaceChildren();filtered.forEach((s,i)=>{let o=el('option',`${i+1} / ${filtered.length} · ${s.id}`);o.value=i;$('session').append(o)});$('coverage').textContent=`${filtered.length} / ${catalog[bench].total_sessions} 会话 · 每版 ${catalog[bench].turns_per_variant} 轮`;current=0;show()}
async function show(){const id=++ticket;$('prev').disabled=current===0;$('next').disabled=current>=filtered.length-1;$('session').value=current;$('content').replaceChildren();if(!filtered.length){$('status').textContent='没有匹配的会话';return}let s=filtered[current];$('status').textContent='正在加载完整会话…';try{let data=await get(`/api/session/${bench}/${s.index}`);if(id!==ticket)return;let root=$('content');root.append(el('h2',`${names[bench]} · ${data.id}`));let n=data.instructions_en.length+1;let instructions=el('div',undefined,'grid');instructions.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;let source=el('div');source.append(el('div','原图 I₀','label'),el('p','两版使用同一原图','muted'));instructions.append(source);data.instructions_en.forEach((text,i)=>{let c=el('div');c.append(el('div',`第 ${i+1} 轮指令 T${i+1}`,'label'),el('div',text,'instruction'));instructions.append(c)});root.append(instructions);
for(let label of ['bare','chat']){let variant=data.variants[label],row=el('section',undefined,'variant');row.append(el('div',label==='bare'?'bare · 原始完整历史协议':'chat · user / assistant 交错历史协议','label'));let grid=el('div',undefined,'grid');grid.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;variant.images.forEach((x,t)=>{let c=el('div',undefined,'cell'),im=el('img');im.alt=`${label} ${data.id} ${t===0?'原图':'第 '+t+' 轮输出'}`;im.src=x.url;im.onerror=()=>{$('status').textContent='图片加载失败，请刷新；未替换为其他实验的图像'};im.onclick=()=>{$('zoomTitle').textContent=im.alt;$('zoomImage').src=x.url;$('zoom').showModal()};c.append(im,el('div',t===0?'原图 I₀':`实际生成 I${t}`,'tag'));grid.append(c)});row.append(grid);root.append(row)}
let details=el('details'),summary=el('summary','实验来源与真实输入记录');details.append(summary,el('p','来源：a800_0 的 sixrun_20261007/experiment 归档。原始图片、metadata 和 attention 保留在服务器。输入哈希链按该协议的全部历史逐轮核对。','muted'),el('pre',JSON.stringify({run_fingerprints:catalog[bench].run_fingerprints,session:data},null,2)));root.append(details);$('status').textContent='';}catch(e){if(id===ticket)$('status').textContent=e.message}}
$('prev').onclick=()=>{if(current>0){current--;show()}};$('next').onclick=()=>{if(current<filtered.length-1){current++;show()}};$('session').onchange=()=>{current=Number($('session').value);show()};$('nextBench').onclick=()=>{let b=order[order.indexOf(bench)+1];if(b)setBench(b)};$('search').oninput=filter;$('split').onchange=filter;$('closeZoom').onclick=()=>$('zoom').close();document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||$('zoom').open)return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
get('/api/catalog').then(x=>{catalog=x;for(let b of order){let bt=el('button',names[b]);bt.dataset.bench=b;bt.onclick=()=>setBench(b);$('benches').append(bt)}let q=new URLSearchParams(location.search).get('bench');setBench(order.includes(q)?q:'edival')}).catch(e=>$('status').textContent=e.message);
</script></html>
