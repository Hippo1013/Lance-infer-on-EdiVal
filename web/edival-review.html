<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdiVal · 多轮编辑结果</title>
<style>
:root{color-scheme:light;--ink:#1d302e;--muted:#697a75;--line:#dce4de;--paper:#f5f7f3;--accent:#176858;--tint:#e5f0e9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #dfb666;outline-offset:2px}button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 13px;color:var(--ink)}button:hover{background:var(--tint)}button:disabled{opacity:.35;cursor:default}header{background:#203c36;color:white;padding:26px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:27px;font-weight:650;letter-spacing:-.8px;margin:2px 0}header p{color:#bed0c6;margin:0;font-size:12px}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:2px;color:#c5d7ba}.stats{display:flex;gap:28px;flex-shrink:0}.stat strong{display:block;font-size:25px;font-weight:500}.stat span{color:#bed0c6;font-size:11px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 126px)}aside{border-right:1px solid var(--line);padding:22px 16px;background:#edf2ed}.aside-title{font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:12px}.filters{display:flex;gap:5px}.filters button{flex:1;padding:5px}.filters button.active{background:var(--accent);color:white;border-color:var(--accent)}input[type=search]{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:12px 0}#session-list{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 330px);overflow:auto;min-height:240px}.session{background:transparent;text-align:left;padding:9px 10px;display:grid;grid-template-columns:26px 1fr;align-items:center;border-color:transparent}.session.active{background:white;border-color:#a8c6b5;box-shadow:0 2px 6px #203c3608}.session span{font-size:11px;color:var(--muted)}.session code{font:11px ui-monospace,monospace}.session small{display:block;font-size:10px;color:var(--accent)}.aside-note{font-size:11px;color:var(--muted);padding-top:18px}main{padding:26px 28px 32px;min-width:0}.topline{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.badge{background:var(--tint);color:var(--accent);padding:4px 9px;border-radius:5px;font-size:11px;font-weight:600}h2{font-size:20px;margin:7px 0 0;font-weight:600}#session-id{font:12px ui-monospace,monospace;color:var(--muted)}.nav{display:flex;align-items:center;gap:10px}.nav span{font:12px ui-monospace,monospace;color:var(--muted)}.helper{display:flex;gap:14px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 0 18px;color:var(--muted);font-size:12px}.helper label{white-space:nowrap;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line)}.card-head strong{font-size:13px}.card-head span{color:var(--muted);font:10px ui-monospace,monospace}.image-button{padding:0;width:100%;height:auto;aspect-ratio:1;border:0;border-radius:0;background:#e9ede7;display:block;position:relative}.image-button:hover{background:#e3e8e0}.image-button img{width:100%;height:100%;object-fit:contain;display:block}.zoom-label{position:absolute;bottom:9px;right:9px;color:white;background:#203c36c9;padding:2px 7px;border-radius:4px;font-size:10px}.image-error{color:#a3412c;padding:12px}.instruction{padding:15px 14px 17px}.instruction .tag{font-size:10px;color:var(--accent);letter-spacing:1px;display:block;margin-bottom:6px}.zh{font-size:13px;line-height:1.9;margin:0}.en{margin:12px 0 0;padding-top:11px;border-top:1px dashed var(--line);color:var(--muted);font-size:11px;line-height:1.65;overflow-wrap:anywhere}.hide-en .en{display:none}.source-note{color:var(--muted);font-size:12px}.footnote{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted)}#error{padding:25px;color:#a3412c}dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);width:96vw;max-width:1600px;max-height:96vh;padding:20px}dialog::backdrop{background:#12241ce0}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.dialog-top h2{margin:0;font-size:17px}.dialog-controls{display:flex;gap:18px;align-items:center;margin:12px 0;flex-wrap:wrap;font-size:12px}select{background:white;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pair figure{margin:0;min-width:0}.pair figcaption{color:var(--muted);font-size:12px;margin-bottom:6px}.pair .viewport{height:58vh;overflow:auto;background:#e6ebe5;display:flex;align-items:center;justify-content:center}.pair img{max-width:100%;max-height:100%;object-fit:contain}.pair.actual .viewport{display:block}.pair.actual img{max-width:none;max-height:none;display:block}.dialog-instruction{font-size:13px;padding:12px 0 0;line-height:1.8}#dialog-en{color:var(--muted);font-size:11px}.empty{padding:18px;color:var(--muted);font-size:12px}@media(min-width:1600px){main{padding:30px 38px}.zh{font-size:14px}}@media(max-width:1100px){.layout{grid-template-columns:190px minmax(0,1fr)}main{padding:20px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{gap:16px}}@media(max-width:650px){header{padding:20px}.stats{display:none}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}.aside-title,.aside-note{display:none}#session-list{min-height:0;max-height:115px;display:grid;grid-template-columns:1fr 1fr}.topline{align-items:start}.nav{gap:4px}.nav button{padding:5px 8px}.helper{align-items:start}.grid{gap:9px}.instruction{padding:10px}.zh{font-size:12px}.footnote{display:block}.pair{grid-template-columns:1fr}.pair .viewport{height:35vh}h1{font-size:24px}h2{font-size:17px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">LANCE / EDIVAL BENCH</div><h1>EdiVal · 多轮编辑结果</h1><p>原图与三轮编辑结果，按会话顺序查看。</p></div><div class="stats"><div class="stat"><strong id="session-count">—</strong><span>全部会话</span></div><div class="stat"><strong id="turn-count">—</strong><span>已生成 / 总轮次</span></div><div class="stat"><strong id="attention-count">—</strong><span id="sample-count">attention 已保存</span></div></div></header>
<div id="error" hidden role="alert"></div>
<div class="layout"><aside><div class="aside-title">会话索引 / SESSIONS</div><div class="filters" aria-label="类别筛选"><button data-filter="all" class="active" aria-pressed="true">全部</button><button data-filter="complete" aria-pressed="false">已生成</button><button data-filter="translated" aria-pressed="false">中文抽查</button></div><input id="search" type="search" placeholder="搜索编号或指令…" aria-label="搜索会话编号或指令"><nav id="session-list" aria-label="全部会话列表"></nav><div class="aside-note" id="sampling-note"></div></aside>
<main id="main" hidden><div class="topline"><div><span id="category" class="badge"></span><h2 id="heading"></h2><span id="session-id"></span></div><div class="nav"><button id="prev" aria-label="上一个会话">← 上一个</button><span id="position"></span><button id="next" aria-label="下一个会话">下一个 →</button></div></div><div class="helper"><span id="hint"></span><label><input type="checkbox" id="english" checked> 显示英文原文</label></div><div id="cards" class="grid"></div><div class="footnote"><span>中文为辅助翻译；缺少译文时显示英文原文。图片完整展示。</span><span>512×512 · 原图与实际保存结果</span></div></main></div>
<dialog id="compare"><div class="dialog-top"><h2 id="dialog-title">轮次对比</h2><button id="close">关闭 ×</button></div><div class="dialog-controls"><label>左图 <select id="reference"><option value="previous">上一轮</option><option value="original">原图</option></select></label><label>右图 <select id="stage"><option value="1">第一轮</option><option value="2">第二轮</option><option value="3">第三轮</option></select></label><label><input id="actual" type="checkbox"> 原始像素尺寸（可滚动）</label><span>Esc 关闭</span></div><div class="pair" id="pair"><figure><figcaption id="left-label"></figcaption><div class="viewport"><img id="left-image" alt="对比左图"></div></figure><figure><figcaption id="right-label"></figcaption><div class="viewport"><img id="right-image" alt="对比右图"></div></figure></div><div class="dialog-instruction" id="dialog-zh"></div><div id="dialog-en"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const names=['原始图像','第一轮编辑','第二轮编辑','第三轮编辑'];
let manifest, sessions=[], filtered=[], activeId='', filter='all';
const current=()=>sessions.find(s=>s.id===activeId);
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function rebuild(){
 const q=$('search').value.trim().toLowerCase();
 filtered=sessions.filter(s=>(filter==='all'||(filter==='complete'&&s.complete)||(filter==='translated'&&s.translated))&&[s.id,...s.instructions_en,...s.instructions_zh].join(' ').toLowerCase().includes(q));
 if(!filtered.some(s=>s.id===activeId))activeId=filtered[0]?.id||'';
 render();
}
function render(){
 const list=$('session-list');list.replaceChildren();
 for(const s of filtered){const b=node('button','session'+(s.id===activeId?' active':''));b.setAttribute('aria-label',s.id);if(s.id===activeId)b.setAttribute('aria-current','true');b.append(node('span','',String(sessions.indexOf(s)+1).padStart(2,'0')));const t=node('div');t.append(node('code','',s.id.split('/')[1]),node('small','','已生成 '+s.completed_turns+' / 3 轮'));b.append(t);b.onclick=()=>{activeId=s.id;render();};list.append(b);}
 if(!filtered.length)list.append(node('p','empty','没有匹配的会话。'));
 $('main').hidden=!activeId;if(!activeId)return;
 const s=current(),index=filtered.indexOf(s);history.replaceState(null,'','#'+s.id);
 $('category').textContent='EdiVal · '+(s.complete?'三轮已生成':'生成中');
 $('heading').textContent='会话 '+String(sessions.indexOf(s)+1).padStart(2,'0');$('session-id').textContent=s.id;
 $('position').textContent=(index+1)+' / '+filtered.length;$('prev').disabled=index===0;$('next').disabled=index===filtered.length-1;
 $('hint').textContent='原图 → 第一轮 → 第二轮 → 第三轮；点击图片放大比较。';
 const cards=$('cards');cards.replaceChildren();
 for(let turn=0;turn<4;turn++){
  const card=node('article','card'),head=node('div','card-head');head.append(node('strong','',names[turn]),node('span','',turn?'OUTPUT 0'+turn:'INPUT 00'));card.append(head);
  const b=node('button','image-button');b.setAttribute('aria-label','放大对比'+names[turn]);if(s.images[turn].available){const im=node('img');im.alt=s.id+' · '+names[turn];im.src=s.images[turn].url;im.decoding='async';im.onerror=()=>{b.replaceChildren(node('span','image-error','图片加载失败，请刷新。'));};b.append(im,node('span','zoom-label','点击对比 ↗'));b.onclick=()=>openCompare(turn||1,turn===0);}else{b.disabled=true;b.append(node('span','source-note','等待本轮生成'));}card.append(b);
  const content=node('div','instruction');content.append(node('span','tag',turn?'编辑指令 / INSTRUCTION':'起始状态 / SOURCE'));
  if(turn){content.append(node('p','zh',s.instructions_zh[turn-1]||s.instructions_en[turn-1]));if(s.instructions_zh[turn-1])content.append(node('p','en',s.instructions_en[turn-1]));}else{content.append(node('p','source-note','本会话保存的原始输入图像。右侧依次为 Lance 在完整交错历史下生成的三轮结果。'),node('p','source-note','点击任意图片，可放大比较相邻轮次，或对照原图。'));}
  card.append(content);cards.append(card);
 }
}
function move(delta){const i=filtered.findIndex(s=>s.id===activeId)+delta;if(i>=0&&i<filtered.length){activeId=filtered[i].id;render();}}
function openCompare(turn,original){const s=current();for(const o of $('stage').options)o.disabled=!s.images[Number(o.value)].available;if(!s.images[turn].available){turn=s.images.findIndex((x,i)=>i>0&&x.available);if(turn<1)return;}$('stage').value=String(turn);$('reference').value=original?'original':'previous';$('actual').checked=false;$('pair').classList.remove('actual');updateCompare();$('compare').showModal();}
function updateCompare(){const s=current(),turn=Number($('stage').value),left=$('reference').value==='original'?0:turn-1;$('dialog-title').textContent=s.id+' · 轮次对比';$('left-label').textContent=names[left];$('right-label').textContent=names[turn];$('left-image').src=s.images[left].url;$('right-image').src=s.images[turn].url;$('left-image').alt=s.id+' '+names[left];$('right-image').alt=s.id+' '+names[turn];$('dialog-zh').textContent=s.instructions_zh[turn-1];$('dialog-en').textContent=s.instructions_en[turn-1];}
for(const b of document.querySelectorAll('[data-filter]'))b.onclick=()=>{filter=b.dataset.filter;for(const x of document.querySelectorAll('[data-filter]')){x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));}rebuild();};
$('search').oninput=rebuild;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('english').onchange=()=>document.body.classList.toggle('hide-en',!$('english').checked);
$('close').onclick=()=>$('compare').close();$('stage').onchange=updateCompare;$('reference').onchange=updateCompare;$('actual').onchange=()=>$('pair').classList.toggle('actual',$('actual').checked);
document.addEventListener('keydown',e=>{if($('compare').open||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}if(e.key==='ArrowRight'){e.preventDefault();move(1);}});
async function refresh(){try{const r=await fetch('/api/manifest');if(!r.ok)throw new Error('HTTP '+r.status);manifest=await r.json();sessions=manifest.sessions;$('session-count').textContent=sessions.length;$('turn-count').textContent=manifest.completed_turns+' / '+manifest.total_turns;$('attention-count').textContent=manifest.attention_files;$('sampling-note').textContent=(manifest.validated?'全量复核通过':'已生成 '+manifest.completed_sessions+' / '+manifest.total_sessions+' 个会话')+'。← → 切换会话 · 点击图片放大';if(!activeId)activeId=decodeURIComponent(location.hash.slice(1));$('error').hidden=true;if(!$('compare').open)rebuild();}catch(e){$('error').hidden=false;$('error').textContent='页面暂时无法读取结果：'+e.message+'。请稍后刷新。';}}
refresh();setInterval(refresh,20000);
</script>
</body></html>
